services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: auditi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # WARNING: Default credentials for local development only. Change for production.
      POSTGRES_DB: audit_db
    ports:
      - "${AUDITI_POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: auditi-backend
    ports:
      - "${AUDITI_BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/audit_db
      DEBUG: "false"
      CORS_ORIGINS: "http://localhost:${AUDITI_FRONTEND_PORT:-5173},http://127.0.0.1:${AUDITI_FRONTEND_PORT:-5173},http://localhost:3000"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend (development)
  frontend:
    build:
      context: ./frontend
      target: builder
    container_name: auditi-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    ports:
      - "${AUDITI_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:${AUDITI_BACKEND_PORT:-8000}/api/v1"
    depends_on:
      - backend

volumes:
  postgres_data:
